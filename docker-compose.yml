services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: matchpredictor
      POSTGRES_USER: matchpredictor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-matchpredictor-dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchpredictor"]
      interval: 5s
      timeout: 5s
      retries: 10

  matchpredictor:
    build:
      context: .
    ports:
      - "8080:10000"
    volumes:
      - ./MatchPredictor.Web/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - PORT=10000
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=matchpredictor;Username=matchpredictor;Password=${POSTGRES_PASSWORD:-matchpredictor-dev}
      # Required secrets — set these in a .env file next to this compose file:
      # - AiLlm__ApiKey=...                   (Gemini AI Studio key for AI chat / advisor; or GEMINI_API_KEY)
      # - AiLlm__Provider=gemini              (optional; use "groq" to roll back to Groq)
      # - GroqApiKey=...                      (legacy fallback if AiLlm__ApiKey is unset)
      # - ApiFootball__ApiKey=...             (fixture enrichment)
      # - Hangfire__Username=... / Hangfire__Password=...      (job dashboard + admin pages)
      # - UsageDashboard__Username=... / UsageDashboard__Password=...  (optional override)
      # - EPPlus__ExcelPackage__License=...   (EPPlus license context)
      # Optional toggles:
      # - RUN_BACKGROUND_JOBS=true            (enable Hangfire server + recurring jobs)
      # - ENABLE_BROWSER_SCRAPING=true        (requires Chrome in the image)
      # - ENABLE_USER_TRACKING=true

volumes:
  postgres-data:
