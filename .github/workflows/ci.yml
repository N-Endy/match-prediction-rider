name: CI

on:
  push:
    branches: [main, master, fable]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MatchPredictor.sln

      - name: Build
        run: dotnet build MatchPredictor.sln --no-restore --configuration Release

      # Investigate tests drive a real Chrome browser against live sites, and
      # LiveNetwork tests call live scraping endpoints; both are excluded from CI
      # for determinism and remain runnable locally on demand.
      - name: Test
        run: >-
          dotnet test MatchPredictor.Tests.Integration/MatchPredictor.Tests.Integration.csproj
          --no-build --configuration Release
          --filter "FullyQualifiedName!~Investigate&Category!=LiveNetwork&Category!=PostgresE2E"
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          retention-days: 7
