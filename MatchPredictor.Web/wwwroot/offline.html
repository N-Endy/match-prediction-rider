<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline – MatchPredictor</title>
  <meta name="theme-color" content="#0a0e17" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0e17;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #3b82f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #0a0e17, #111827);
      color: var(--text);
      text-align: center;
    }
    main { max-width: 28rem; }
    h1 { font-size: 1.5rem; margin: 0 0 0.75rem; }
    p { color: var(--muted); line-height: 1.6; margin: 0 0 1.5rem; }
    a {
      display: inline-block;
      padding: 0.75rem 1.25rem;
      border-radius: 999px;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>MatchPredictor needs a connection for live predictions, betslips, and AI chat. Check your network and try again.</p>
    <a href="/">Back to home</a>
  </main>
</body>
</html>
